    <section id="section-faq">
        <h1>FAQ</h1>

        <div class="suggestions">
            <button class="sugg-btn" onclick="askSuggestion(this)">C'est quoi la Green IT ?</button>
            <button class="sugg-btn" onclick="askSuggestion(this)">Quelles formations en informatique ?</button>
            <button class="sugg-btn" onclick="askSuggestion(this)">Comment candidater à l'EFREI ?</button>

        <div id="chat-box"></div>

        <div class="chat-input-row">
            <input type="text" id="user-input" placeholder="Posez votre question..."

            <button onclick="fetchJSON('../json/intents.json')">Envoyer</button>
        </div>
