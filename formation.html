body{
    background-color :rgb(38, 75, 122);
    font-family : Arial, sans-serif; 
    text-align: justify;

    margin-top: 20px;

h1 {
    color: white;
    text-align: center;
    font-size: 80px;

    font-family: 'Poppins', sans-serif;
    font-weight: 600;
}

h2 {
    color: black;
    font-size: 30px;

    font-family: 'Poppins', sans-serif;
    font-weight: 600;
}

.mySlides {
    display: none;
}

.mySlides:first-child {
    display: block;
}

.slideshow-container {
  max-width: 1000px;
  position: relative;
  margin: auto;
}

  cursor: pointer;

  top: 50%;

  right: 0;

}

  height: 15px;

/* NAVBAR */
.navbar {

    justify-content: space-between;

<body>
    <nav class="navbar">
    <div class="logo">EFREI</div>

    <ul class="nav-links">
        <li><a href="acceuil.html">Accueil</a></li>
        <li><a href="formation.html">Infos cours et formation</a></li>
        <li><a href="agenda.html">Agenda</a></li>
        <li><a href="equipe.html">Equipe enseignante</a></li>
    </ul>
</nav>
<div class="quiz-container">
    <h1>🎯 Quel métier informatique est fait pour toi ?</h1>

    <div id="quiz">
        <div class="question" id="question"></div>
        <div id="answers"></div>
    </div>

    <div id="result"></div>
</div>

<script>
const questions = [
    {
        question: "Tu préfères :",
        answers: [
            { text: "Créer des sites web", type: "web" },
            { text: "Analyser des données", type: "data" },
            { text: "Sécuriser des systèmes", type: "cyber" },
            { text: "Créer des jeux vidéo", type: "game" }
        ]
    },
    {
        question: "Ton point fort :",
        answers: [
            { text: "Créativité", type: "web" },
            { text: "Logique", type: "data" },
            { text: "Vigilance", type: "cyber" },
            { text: "Imagination", type: "game" }
        ]
    },
    {
        question: "Tu préfères travailler :",
        answers: [
            { text: "Sur l'interface utilisateur", type: "web" },
            { text: "Avec des chiffres", type: "data" },
            { text: "Contre les hackers", type: "cyber" },
            { text: "Sur des univers virtuels", type: "game" }
        ]
    }
];

let currentQuestion = 0;
let scores = {
    web: 0,
    data: 0,
    cyber: 0,
    game: 0
};

function showQuestion() {
    let q = questions[currentQuestion];
    document.getElementById("question").textContent = q.question;
    let answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach(answer => {
        let btn = document.createElement("button");
        btn.textContent = answer.text;
        btn.onclick = () => selectAnswer(answer.type);
        answersDiv.appendChild(btn);
    });
}

function selectAnswer(type) {
    scores[type]++;
    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";

    let best = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);

    let resultText = "";

    if (best === "web") {
        resultText = "🌐 Développement Web (Front-end / Back-end)";
    } else if (best === "data") {
        resultText = "📊 Data Science / Analyse de données";
    } else if (best === "cyber") {
        resultText = "🔐 Cybersécurité";
    } else if (best === "game") {
        resultText = "🎮 Développement de jeux vidéo";
    }

    document.getElementById("result").textContent = "Résultat : " + resultText;
}

showQuestion();
</script>

</body>
</html>
